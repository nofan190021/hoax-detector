<!DOCTYPE html>
<html>
<head>
    <title>Deteksi Hoax</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-dark text-white">

<div class="container mt-5">
    <h1 class="text-center">📰 Deteksi Berita Hoax</h1>

    <form method="POST">
        <textarea class="form-control mt-3" name="text" rows="5" placeholder="Masukkan berita..."></textarea>
        <button class="btn btn-primary mt-3 w-100">Cek Berita</button>
    </form>

    {% if result %}
    <div class="mt-4 p-4 rounded 
        {% if result == 'FAKE' %} bg-danger {% else %} bg-success {% endif %}">
        
        <h3>Hasil: {{ result }}</h3>
        <p>Confidence: {{ confidence }}%</p>
    </div>
    {% endif %}

    <div class="text-center mt-4">
        <p>Akurasi Model: <b>82%</b></p>
        <p>Metode: Logistic Regression + Bagging + TF-IDF</p>
    </div>
</div>

</body>
</html>
