<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Hoax Detector</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #0f172a;
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .container {
            background: #1e293b;
            padding: 30px;
            border-radius: 12px;
            width: 400px;
            box-shadow: 0 0 20px rgba(0,0,0,0.3);
        }

        h1 {
            text-align: center;
            margin-bottom: 20px;
        }

        textarea {
            width: 100%;
            height: 120px;
            border-radius: 8px;
            border: none;
            padding: 10px;
            resize: none;
            margin-bottom: 15px;
        }

        button {
            width: 100%;
            padding: 10px;
            border: none;
            border-radius: 8px;
            background: #38bdf8;
            color: black;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #0ea5e9;
        }

        .result {
            margin-top: 20px;
            padding: 10px;
            border-radius: 8px;
            text-align: center;
        }

        .real {
            background: #22c55e;
        }

        .fake {
            background: #ef4444;
        }

        .error {
            background: #facc15;
            color: black;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>📰 Hoax Detector</h1>

    <form method="POST">
        <textarea name="text" placeholder="Masukkan berita di sini..." required></textarea>
        <button type="submit">Cek Berita</button>
    </form>

    {% if result %}
        <div class="result 
            {% if result == 'REAL' %}real
            {% elif result == 'FAKE' %}fake
            {% else %}error
            {% endif %}">
            
            <h3>{{ result }}</h3>

            {% if confidence %}
                <p>Confidence: {{ confidence }}%</p>
            {% endif %}
        </div>
    {% endif %}

</div>

</body>
</html>
