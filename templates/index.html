<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Hoax Detector</title>

<style>
* {
    box-sizing: border-box;
}

body {
    font-family: 'Segoe UI', sans-serif;
    background: linear-gradient(135deg, #0f172a, #1e293b);
    color: white;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    margin: 0;
}

.container {
    background: #1e293b;
    padding: 30px;
    border-radius: 16px;
    width: 420px;
    box-shadow: 0 10px 40px rgba(0,0,0,0.4);
    text-align: center;
    animation: fadeIn 0.6s ease;
    margin: auto;
}

@keyframes fadeIn {
    from { opacity: 0; transform: translateY(20px);}
    to { opacity: 1; transform: translateY(0);}
}

h1 {
    margin-bottom: 20px;
}

textarea {
    width: 100%;
    height: 130px;
    border-radius: 10px;
    border: none;
    padding: 12px;
    resize: none;
    margin-bottom: 15px;
    font-size: 14px;
    outline: none;
    display: block;
}

button {
    width: 100%;
    padding: 12px;
    border: none;
    border-radius: 10px;
    background: linear-gradient(135deg, #38bdf8, #0ea5e9);
    color: white;
    font-weight: bold;
    cursor: pointer;
    transition: 0.3s;
    display: block;
}

button:hover {
    transform: scale(1.03);
    background: linear-gradient(135deg, #0ea5e9, #0284c7);
}

.result-box {
    margin-top: 20px;
    padding: 15px;
    border-radius: 12px;
    font-weight: bold;
    animation: fadeIn 0.4s ease;
}

.real {
    background: #16a34a;
}

.fake {
    background: #dc2626;
}

.error {
    background: #facc15;
    color: black;
}

.conf {
    font-size: 14px;
    margin-top: 5px;
}

.footer {
    margin-top: 15px;
    font-size: 12px;
    opacity: 0.6;
}
</style>
</head>

<body>

<div class="container">
    <h1>📰 Hoax Detector</h1>

    <form method="POST">
        <textarea name="text" placeholder="Masukkan berita di sini..." required></textarea>
        <button type="submit">🔍 Cek Berita</button>
    </form>

    {% if result %}
        <div class="result-box 
            {% if result == 'REAL' %}real
            {% elif result == 'FAKE' %}fake
            {% else %}error
            {% endif %}">
            
            {{ result }}

            {% if confidence %}
                <div class="conf">Confidence: {{ confidence }}%</div>
            {% endif %}
        </div>
    {% endif %}

    <div class="footer">
        AI-based Hoax Detection System
    </div>
</div>

</body>
</html>
